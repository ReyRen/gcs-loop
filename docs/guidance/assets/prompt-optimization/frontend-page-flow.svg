<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">基于评测实验优化 Prompt 的前端页面流</title>
  <desc id="desc">从实验详情选样本、配置优化、运行优化、查看结果、应用到草稿到提交新版本的完整前端流程。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#27315f" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b73ff"/>
    </marker>
    <style>
      .title { font: 700 26px system-ui, "Microsoft YaHei", sans-serif; fill: #1f2440; }
      .step { font: 700 18px system-ui, "Microsoft YaHei", sans-serif; fill: #242a45; }
      .body { font: 14px system-ui, "Microsoft YaHei", sans-serif; fill: #596078; }
      .hint { font: 13px system-ui, "Microsoft YaHei", sans-serif; fill: #7a8199; }
      .api { font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #4d55c7; }
      .badge { font: 700 12px system-ui, "Microsoft YaHei", sans-serif; fill: white; }
    </style>
  </defs>
  <rect width="1440" height="760" rx="24" fill="#f7f8fc"/>
  <text x="52" y="58" class="title">前端页面与接口联动总览</text>
  <text x="52" y="86" class="body">优化结果不会自动发布：先写入草稿，再复用原版本提交流程。</text>

  <g filter="url(#shadow)">
    <rect x="52" y="126" width="245" height="236" rx="18" fill="white"/>
    <rect x="52" y="126" width="245" height="8" rx="4" fill="#5666f6"/>
    <circle cx="82" cy="168" r="16" fill="#5666f6"/><text x="78" y="173" class="badge">1</text>
    <text x="108" y="174" class="step">实验详情</text>
    <text x="74" y="212" class="body">• 已完成的 Prompt 实验</text>
    <text x="74" y="239" class="body">• 选择 1～20 条样本</text>
    <text x="74" y="266" class="body">• 点击“智能优化”</text>
    <rect x="72" y="294" width="205" height="42" rx="9" fill="#eef0ff"/>
    <text x="84" y="312" class="api">GET .../prepare</text>
    <text x="84" y="328" class="hint">校验资格并返回字段建议</text>
  </g>

  <path d="M 307 244 L 343 244" stroke="#6b73ff" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="354" y="126" width="245" height="236" rx="18" fill="white"/>
    <rect x="354" y="126" width="245" height="8" rx="4" fill="#7b64f8"/>
    <circle cx="384" cy="168" r="16" fill="#7b64f8"/><text x="380" y="173" class="badge">2</text>
    <text x="410" y="174" class="step">优化配置</text>
    <text x="376" y="212" class="body">• Prompt 变量 → 数据字段</text>
    <text x="376" y="239" class="body">• 模型回答与参考答案字段</text>
    <text x="376" y="266" class="body">• 效果优先 / 性价比优先</text>
    <rect x="374" y="294" width="205" height="42" rx="9" fill="#f2efff"/>
    <text x="386" y="312" class="api">POST .../optimizations</text>
    <text x="386" y="328" class="hint">立即返回 queued 任务</text>
  </g>

  <path d="M 609 244 L 645 244" stroke="#6b73ff" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="656" y="126" width="245" height="236" rx="18" fill="white"/>
    <rect x="656" y="126" width="245" height="8" rx="4" fill="#a45bf0"/>
    <circle cx="686" cy="168" r="16" fill="#a45bf0"/><text x="682" y="173" class="badge">3</text>
    <text x="712" y="174" class="step">运行中</text>
    <text x="678" y="212" class="body">• 阶段、进度、当前轮次</text>
    <text x="678" y="239" class="body">• 当前最佳得分与 Token</text>
    <text x="678" y="266" class="body">• 支持取消和刷新恢复</text>
    <rect x="676" y="294" width="205" height="42" rx="9" fill="#f7effc"/>
    <text x="688" y="312" class="api">GET .../{optimization_id}</text>
    <text x="688" y="328" class="hint">可见时每 1～2 秒轮询</text>
  </g>

  <path d="M 911 244 L 947 244" stroke="#6b73ff" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="958" y="126" width="430" height="236" rx="18" fill="white"/>
    <rect x="958" y="126" width="430" height="8" rx="4" fill="#4659dc"/>
    <circle cx="988" cy="168" r="16" fill="#4659dc"/><text x="984" y="173" class="badge">4</text>
    <text x="1014" y="174" class="step">优化结果</text>
    <rect x="980" y="198" width="176" height="73" rx="11" fill="#fff5f5" stroke="#ffd7d7"/>
    <text x="994" y="220" class="hint">原 Prompt / 基线分</text>
    <text x="994" y="252" style="font:700 24px system-ui;fill:#f26767">0.5</text>
    <rect x="1170" y="198" width="194" height="73" rx="11" fill="#f1fbf6" stroke="#c8f0d8"/>
    <text x="1184" y="220" class="hint">优化 Prompt / 最佳分</text>
    <text x="1184" y="252" style="font:700 24px system-ui;fill:#2cb874">0.7</text>
    <text x="980" y="300" class="body">逐样本展示原回答、优化回答、得分和理由</text>
    <rect x="1220" y="316" width="144" height="34" rx="9" fill="#4257e5"/>
    <text x="1244" y="338" class="badge">提交新版本</text>
  </g>

  <path d="M 1174 372 L 1174 418" stroke="#6b73ff" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="790" y="430" width="598" height="254" rx="18" fill="white"/>
    <rect x="790" y="430" width="598" height="8" rx="4" fill="#22a66f"/>
    <circle cx="820" cy="472" r="16" fill="#22a66f"/><text x="816" y="477" class="badge">5</text>
    <text x="846" y="478" class="step">应用到草稿，再提交正式版本</text>
    <rect x="818" y="506" width="242" height="60" rx="11" fill="#eff9f4"/>
    <text x="832" y="528" class="api">POST .../apply_to_draft</text>
    <text x="832" y="549" class="hint">只写草稿，不发布</text>
    <path d="M 1070 536 L 1100 536" stroke="#22a66f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1110" y="506" width="250" height="60" rx="11" fill="#eef0ff"/>
    <text x="1124" y="528" class="api">GET Prompt?with_draft=true</text>
    <text x="1124" y="549" class="hint">打开编辑页，允许人工校验</text>
    <path d="M 1088 580 L 1088 610" stroke="#22a66f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="870" y="620" width="438" height="42" rx="10" fill="#22a66f"/>
    <text x="902" y="646" class="badge">POST /api/prompt/v1/prompts/{prompt_id}/drafts/commit</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="52" y="430" width="690" height="254" rx="18" fill="white"/>
    <text x="78" y="474" class="step">关键交互规则</text>
    <circle cx="84" cy="510" r="5" fill="#5666f6"/><text x="100" y="515" class="body">“提交新版本”第一次点击调用 apply_to_draft，不直接 commit。</text>
    <circle cx="84" cy="548" r="5" fill="#5666f6"/><text x="100" y="553" class="body">已有草稿时先二次确认，确认后传 overwrite_existing_draft=true。</text>
    <circle cx="84" cy="586" r="5" fill="#5666f6"/><text x="100" y="591" class="body">应用成功后跳转 Prompt 编辑页，继续使用现有版本差异和提交弹窗。</text>
    <circle cx="84" cy="624" r="5" fill="#5666f6"/><text x="100" y="629" class="body">任何非零 code 都保留当前页面和用户选择，不自动重试破坏性操作。</text>
  </g>
</svg>
