# Locally served models verified through the OpenAI-compatible Ollama endpoint.
# Keep model IDs stable for the primary language model and the retained VL model.
models:
- id: 1
  name: "Qwen3-30B-Instruct"
  desc: "Local language model for Prompt development, evaluation and optimization."
  ability:
    # The serving instance currently uses a 16K context window.
    max_context_tokens: 16384
    max_input_tokens: 16384
    max_output_tokens: 16384
    function_call: true
    json_mode: true
    multi_modal: false
    thinking: false
  frame: "eino"
  protocol: "openai"
  protocol_config:
    base_url: "http://172.18.127.67:11434/v1"
    api_key: "dummy"
    model: "qwen3:30b-instruct"
    timeout_ms: 180000
  scenario_configs:
    default:
      scenario: "default"
      quota: { qpm: 0, tpm: 0 }
      unavailable: false
    prompt_debug:
      scenario: "prompt_debug"
      quota: { qpm: 0, tpm: 0 }
      unavailable: false
    eval_target:
      scenario: "eval_target"
      quota: { qpm: 0, tpm: 0 }
      unavailable: false
    evaluator:
      scenario: "evaluator"
      quota: { qpm: 0, tpm: 0 }
      unavailable: false
  param_config:
    param_schemas:
      - name: "temperature"
        label: "temperature"
        desc: "Controls generation randomness."
        type: "float"
        min: "0"
        max: "1.0"
        default_value: "0.3"
      - name: "max_tokens"
        label: "max_tokens"
        desc: "Maximum output tokens within the serving context window."
        type: "int"
        min: "1"
        max: "16384"
        default_value: "2048"
      - name: "top_p"
        label: "top_p"
        desc: "Controls nucleus sampling."
        type: "float"
        min: "0.001"
        max: "1.0"
        default_value: "0.9"

- id: 5
  name: "Qwen2.5-VL-7B"
  desc: "Local vision-language model for image understanding and text recognition."
  ability:
    max_context_tokens: 8192
    max_input_tokens: 8192
    max_output_tokens: 2048
    function_call: false
    json_mode: false
    multi_modal: true
    thinking: false
    ability_multi_modal:
      image: true
      ability_image:
        url_enabled: true
        binary_enabled: true
        max_image_size: 20
        max_image_count: 10
  frame: "eino"
  protocol: "openai"
  protocol_config:
    base_url: "http://172.18.127.67:11434/v1"
    api_key: "dummy"
    model: "qwen2.5vl:7b"
    timeout_ms: 180000
  scenario_configs:
    default:
      scenario: "default"
      quota: { qpm: 0, tpm: 0 }
      unavailable: false
    prompt_debug:
      scenario: "prompt_debug"
      quota: { qpm: 0, tpm: 0 }
      unavailable: false
    eval_target:
      scenario: "eval_target"
      quota: { qpm: 0, tpm: 0 }
      unavailable: false
    evaluator:
      scenario: "evaluator"
      quota: { qpm: 0, tpm: 0 }
      # Model-backed evaluators require function calling.
      unavailable: true
  param_config:
    param_schemas:
      - name: "temperature"
        label: "temperature"
        desc: "Controls generation randomness."
        type: "float"
        min: "0"
        max: "1.0"
        default_value: "0"
      - name: "max_tokens"
        label: "max_tokens"
        desc: "Maximum number of output tokens."
        type: "int"
        min: "1"
        max: "2048"
        default_value: "1024"
      - name: "top_p"
        label: "top_p"
        desc: "Controls nucleus sampling."
        type: "float"
        min: "0.001"
        max: "1.0"
        default_value: "0.9"
