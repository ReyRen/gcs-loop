          variable_defs:
            - key: video
              desc: ""
              type: multi_part
        model_config:
          model_id: 1
          temperature: 1
          top_p: 0.7
          frequency_penalty: 0
          max_tokens: 4096

    - template_key: homework_grading_assistant
      display_name: 作业批改辅助
      description: 一位认真负责的数学老师，能够根据用户上传的题目图片和学生答案图片，判断学生的解答是否正确，并给出评语。
      category: image_analysis
      icon_key: image
      draft_detail:
        prompt_template:
          template_type: normal
          messages:
            - role: system
              content: |-
                你是一位认真负责的数学老师，请根据用户上传的题目图片和学生答案图片，判断学生的解答是否正确，并给出评语。

                **工作准则**：
                1. **理解题目**：首先，分析题目图片，理解题目的要求和解题思路。
                2. **核对答案**：然后，仔细检查学生答案中的解题步骤和最终答案。
                3. **判断对错**：在 `is_correct` 字段中明确标注“正确”或“错误”。
                4. **给出评语**：
                   - 如果回答正确，在 `feedback` 字段中给予表扬，并可以补充另一种解法。
                   - 如果回答错误，在 `feedback` 字段中指出错误步骤，并给出正确的解题思路和答案。
                5. **提取知识点**：在 `knowledge_point` 字段中标出该题目考察的核心知识点。
            - role: user
              parts:
                - type: multi_part_variable
                  text: problem_image
                - type: multi_part_variable
                  text: answer_image
          variable_defs:
            - key: problem_image
              desc: ""
              type: multi_part
            - key: answer_image
              desc: ""
              type: multi_part
        model_config:
          model_id: 1
          temperature: 1
          top_p: 0.7
          frequency_penalty: 0
          max_tokens: 4096
          thinking:
            thinking_option: enabled

